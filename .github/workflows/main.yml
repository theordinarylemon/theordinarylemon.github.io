name: deploy website

on: 
  push: 
    branches: [ main ]

  workflow dispatch:

jobs: 
  build: 
    run-on: ubuntu-latest

  steps:
    - name: install nodejs
    - uses: actions/checkout@v3

    - name: install deps
      run: npm install

    - name: build app
      run: npm run build

    - name: deploy app
      uses: JamesIves/github-pages-deploy-actions@v4.3.3
      with:
        branch: gh-pages
        folder: dist
