name: deploy website

on: 
  push: 
    branches:
      - main

jobs: 
  build-and-deply: 
    run-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@2.3.4
      with:
        persist-credentials: false

    - name: install and build
      run:
        npm install
        npm run build

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@4.1.5
      with:
        folder: dist
        branch: main
        repository-name: theordinarylemon/theordinarylemon.github.io